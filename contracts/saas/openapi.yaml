      - $ref: '#/components/parameters/HeaderXCsrfToken'
      - $ref: '#/components/parameters/HeaderIdempotencyKey'
      - name: X-Expected-Revision
        in: header
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      - name: X-File-Name
        in: header
        required: true
        schema:
          type: string
          maxLength: 1440
        description: URL-encoded filename; decoded length 1–120 characters, no controls.
      - name: X-Synthetic-Confirmed
        in: header
        required: true
        schema:
          type: string
          const: 'true'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 8388608
      description: One file per request, maximum 8 MiB by default. The filename is
        URL-encoded UTF-8 data, never a storage path. The upload remains quarantined
        until the isolated worker verifies PDF/image structure. Reuse the same idempotency
        key and exact payload when the response is lost.
