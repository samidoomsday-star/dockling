components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: dockling_session
      description: Opaque server session; Secure, HttpOnly, SameSite. Not an OIDC
        access token or browser role.
    PaymentSignature:
      type: apiKey
      in: header
      name: Payment-Signature
      description: Placeholder for the selected provider signature scheme; validate
        raw provider bytes, timestamp and replay policy before processing.
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          maxLength: 80
        message:
          type: string
          maxLength: 250
        request_id: &id001
          type: string
          format: uuid
        fields:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
                maxLength: 120
              code:
                type: string
                maxLength: 80
            required:
            - path
            - code
            additionalProperties: false
          maxItems: 50
      required:
      - code
      - message
      - request_id
      additionalProperties: false
    Session:
      type: object
      properties:
        user_id: *id001
        workspace_id:
          anyOf:
          - *id001
          - type: 'null'
        role:
          anyOf:
          - &id002
            type: string
            enum:
            - owner
            - editor
            - viewer
          - type: 'null'
        platform_admin: &id003
          type: boolean
        csrf_token:
          type: string
          maxLength: 150
        expires_at: &id005
          type: string
          format: date-time
      required:
      - user_id
      - workspace_id
      - role
      - platform_admin
      - csrf_token
      - expires_at
      additionalProperties: false
    Workspace:
      type: object
      properties:
        id: *id001
        name:
          type: string
          maxLength: 80
        role: *id002
      required:
      - id
      - name
      - role
      additionalProperties: false
    WorkspaceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
          maxItems: 100
        next_cursor:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    WorkspaceSelect:
      type: object
      properties:
        workspace_id: *id001
      required:
      - workspace_id
      additionalProperties: false
    Member:
      type: object
      properties:
        id: *id001
        display_name:
          type: string
          maxLength: 80
        role: *id002
        active: *id003
        version: &id004
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
      - id
      - display_name
      - role
      - active
      - version
      additionalProperties: false
    MemberList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
          maxItems: 100
        next_cursor:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
      required:
      - items
      - next_cursor
      additionalProperties: false
    MemberCommand:
      type: object
      properties:
        expected_version: *id004
        role: *id002
        active: *id003
      required:
      - expected_version
      additionalProperties: false
      minProperties: 2
    Invitation:
      type: object
      properties:
        id: *id001
        role: *id002
        expires_at: *id005
        status:
          type: string
          enum:
          - pending
