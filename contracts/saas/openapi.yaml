openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Dockling hosted API contract
  version: 0.4.1
  description: Versioned SaaS design. Hosted Phases 1–4 are implemented for synthetic
    local acceptance; billing, public deployment and future aliases remain planned.
    Uploads/workbook apply use bounded raw bytes. AI uses separate consent and conservative
    reservations; production teardown recovery remains a deployment gate.
servers:
- url: /api/v1
security:
- SessionCookie: []
paths:
